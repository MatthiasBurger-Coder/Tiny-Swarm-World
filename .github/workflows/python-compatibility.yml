name: Python Compatibility

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: python-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Conda Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Set Up Conda
        uses: conda-incubator/setup-miniconda@835234971496cad1653abb28a638a281cf32541f # v3.2.0
        with:
          activate-environment: tiny-swarm-world
          auto-activate-base: false
          environment-file: environment.yml
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}

      - name: Install Locked Runtime
        shell: bash -el {0}
        run: |
          set -Eeuo pipefail
          python --version
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install "packaging==25.0"
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Run Deterministic Test Contract
        shell: bash -el {0}
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python -m unittest discover -s tests -t .
